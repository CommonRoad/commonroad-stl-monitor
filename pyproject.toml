[project]
name = "commonroad-stl-monitor"
version = "2024.1"
authors = [{name = "Luis Gressenbuch", email = "luis.gressenbuch@tum.de"}, {name = "Yuanfei Lin", email = "yuanfei.lin@tum.de"}]
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.poetry]
packages = [
    {include = "crmonitor"},
    # Vendor rtamt to let omegaconf decide on the antlr version.
    { from = "external/rtamt", include = "rtamt" }
]

[tool.poetry.dependencies]
python = ">=3.10, <3.12"
commonroad-io = ">=2024.3"
ruamel-yaml = ">=0.16.12"
commonroad-route-planner = "^2025.1.0"
numba = ">=0.58.1"
commonroad-mpr = { git = "git@gitlab.lrz.de:cps/commonroad/commonroad-model-predictive-robustness.git", rev = "d3eaa905a676c728c7261eed022521e9a08fa847" }
pyqt6 = "^6.8.1"
commonroad-clcs = "^2025.1.1"
commonroad-drivability-checker = "^2025.1"
networkx = "^3.4.2"
pygraphviz = "^1.14"
matplotlib = "3.10.1"
tikzplotlib = "^0.10.1"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
coverage = "^6.5.0"

[tool.poetry.group.doc]
optional = true

[tool.poetry.group.doc.dependencies]
sphinx = "^5.3.0"
myst-parser = "^0.18.1"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
indent-width = 4
format.quote-style = "double"
target-version = "py311"
src = ["crmonitor", "tests"]
# TODO: execpt for fastl and external, all folders should be covered by ruff.
extend-exclude = ["crmonitor/rule/fastl/*.py", "tutorials/", "scenarios/", "external/", "tests/"]
# force exclude because pre-commit might pass those files explicitly, which will override the exclude.
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "I", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
