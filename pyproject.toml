[tool.poetry]
name = "commonroad-stl-monitor"
version = "2022.3"
description = ""
authors = ["Luis Gressenbuch <luis.gressenbuch@tum.de>"]
readme = "README.md"
packages = [{include = "crmonitor"}]

[tool.poetry.dependencies]
python = "^3.8"
commonroad-io = ">=2020"
#commonroad-vehicle-models = ">=2"
ruamel-yaml = ">=0.16.12"
commonroad-drivability-checker = ">=2021.1"
numba = "^0.56.0"
rtamt = {git = "https://github.com/nickovic/rtamt.git", rev = "8c437d8d703d5359a16db1b9dac0d90faadaa5b3"}

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
coverage = "^6.5.0"
# To run the tests, we necessarily need this commonroad-io version
commonroad-io = ">=2022.2"

[tool.poetry.group.doc]
optional = true

[tool.poetry.group.doc.dependencies]
sphinx = "^5.3.0"
myst-parser = "^0.18.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
