[tool.poetry]
name = "commonroad-stl-monitor"
version = "2022.3"
description = ""
authors = ["Luis Gressenbuch <luis.gressenbuch@tum.de>"]
readme = "README.md"
packages = [{include = "crmonitor"}]

[tool.poetry.dependencies]
python = "^3.8"
commonroad-io = ">=2020"
commonroad-vehicle-models = ">=2"
ruamel-yaml = ">=0.16.12"
commonroad-drivability-checker = ">=2022.2"
numba = "^0.56.0"
rtamt = {git = "https://github.com/cirrostratus1/rtamt.git", rev = "adafd0c73884fe260d7a59b678ac4e452cbf73c9"}

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
coverage = "^6.5.0"
# To run the tests, we necessarily need this commonroad-io version
commonroad-io = ">=2022.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
