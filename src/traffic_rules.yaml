# Traffic rules formalized in metric temporal logic (MTL)
###
# .. code-block:: yaml
#
#   - R_G1: safe distance preceding, neglecting cut-in vehicles
#   - R_G2: unnecessary braking only if safe distance is violated
#   - R_G3: speed limit
#   - R_G4: required speed
#   - R_G5: preserves traffic flow
#   - R_I1: no standing on interstates
#   - R_I2: overtaking right-hand side on interstates
#   - R_I3: prevent u-turn and reversing on interstates
#   - R_I4: emergency lane
#   - R_I5: consider entering vehicles
#   - R_I6: gap for entering vehicles
traffic_rules_forward:
    R_G1: (G(~(cut_in__x_o__x_ego)) -> G((in_same_lane__x_ego__x_o & in_front_of__x_ego__x_o) -> keeps_safe_distance_prec__x_ego__x_o))
    R_G2: (G(keeps_safe_distance_prec__x_ego__x_o) -> G(~(unnecessary_braking__x_ego)))
    R_G3: G(keeps_lane_speed_limit__x_ego & keeps_fov_speed_limit__x_ego & keeps_braking_speed_limit__x_ego & keeps_road_condition_speed_limit__x_ego & keeps_type_speed_limit__x_ego)
    R_G4: G(keeps_sign_min_speed_limit__x_ego)
    R_G5: G(~(slow_leading_vehicle__x_ego) -> preserves_traffic_flow__x_ego)
    R_I1: G(~((in_congestion__x_ego) | (exist_standing_leading_vehicle__x_ego)) -> ~(in_standstill__x_ego))
    R_I2: G((left_of__x_ego__x_o & drives_faster__x_ego__x_o) -> ((in_congestion__x_o & drives_with_slightly_higher_speed__x_ego__x_o) | (right_of_broad_lane_marking__x_ego & left_of_broad_lane_marking__x_o) | (on_access_ramp__x_ego & ~(in_congestion__x_o))))
    R_I3: G(~(makes_u_turn__x_ego) & ~(reverses__x_ego))
    R_I4: G(in_congestion__x_ego -> ((~on_shoulder__x_ego) & (interstate_broad_enough__x_ego -> ((in_leftmost_lane__x_ego -> drives_leftmost__x_ego) & (~(in_leftmost_lane__x_ego) -> drives_rightmost__x_ego))) & (~(interstate_broad_enough__x_ego) -> drives_right_lane_rightmost__x_ego)))
    R_I5: G((on_access_ramp__x_o & F(on_main_carriage_way__x_o)) -> (on_main_carriage_way__x_ego & ~(~(in_rightmost_lane_of_same_type__x_ego) & F(in_rightmost_lane_of_same_type__x_ego))))
    R_I6: ((on_access_ramp__x_o & F(on_main_carriage_way__x_o) & G(in_front_of__x_ego__x_o) & ~G(keeps_safe_distance_prec__x_ego__x_o)) -> G((brakes_stronger__x_ego__x_o & drives_faster__x_o__x_ego) | (brakes_stronger__x_ego__x_o & F(G(drives_faster__x_o__x_ego))) | F(G(keeps_safe_distance_prec__x_ego__x_o))))

  #  R_I7: G((~(in_same_lane__x_ego__x_o) &  F(in_front_of__x_o__x_ego & in_same_lane__x_ego__x_o)) -> F(G(in_same_lane__x_ego__x_o & keeps_safe_distance_prec__x_o__x_ego)))
  #  R_I8: G(((in_same_lane__x_ego__x_o & in_front_of__x_ego__x_o & ~(keeps_safe_distance_prec__x_ego__x_o)) | F(in_same_lane__x_ego__x_o & in_front_of__x_ego__x_o & ~(keeps_safe_distance_prec__x_ego__x_o))) -> (brakes_stronger__x_ego__x_o & (drives_faster__x_o__x_ego | F(G(drives_faster__x_o__x_ego))) | F(G(keeps_safe_distance_prec__x_ego__x_o))))

traffic_rules_backward:
    R_G1: always((in_front_of(time_step, ego_vehicle, other_vehicle)
            && in_same_lane(time_step, ego_vehicle, other_vehicle))
            -> keeps_safe_distance_prec(time_step, ego_vehicle, other_vehicle))
    R_G2: always(!(unnecessary_braking(time_step, ego_vehicle, other_vehicles)))
    R_G3: always(keeps_lane_speed_limit(time_step, ego_vehicle) && keeps_fov_speed_limit(time_step, ego_vehicle)
                 && keeps_braking_speed_limit(time_step, ego_vehicle)
                 && keeps_road_condition_speed_limit(time_step, ego_vehicle)
                 && keeps_type_speed_limit(time_step, ego_vehicle))
    R_G4: always(keeps_sign_min_speed_limit(time_step, ego_vehicle))
    R_G5: always(!(slow_leading_vehicle(time_step, ego_vehicle, other_vehicles)) -> preserves_traffic_flow(time_step, ego_vehicle))
    R_I1: always(!((in_congestion(time_step, ego_vehicle, other_vehicles)) ||
            (exist_standing_leading_vehicle(time_step, ego_vehicle, other_vehicles)))
                 -> !(in_standstill(time_step, ego_vehicle)))
    R_I2: always((left_of(time_step, ego_vehicle, other_vehicle)
                        && drives_faster(time_step, ego_vehicle, other_vehicle))
                  -> ((in_congestion(time_step, other_vehicle, other_vehicles)
                        && drives_with_slightly_higher_speed(time_step, ego_vehicle, other_vehicle))
                  || (right_of_broad_lane_marking(time_step, ego_vehicle)
                        && left_of_broad_lane_marking(time_step, other_vehicle))
                  || (on_access_ramp(time_step, ego_vehicle)
                        && !(in_congestion(time_step, other_vehicle, other_vehicles)))))
    R_I3: always(!(makes_u_turn(time_step, ego_vehicle)) && !(reverses(time_step, ego_vehicle)))
    R_I4: always(in_congestion(time_step, ego_vehicle, other_vehicles) ->
                  ((!on_shoulder(time_step, ego_vehicle))
                  && (interstate_broad_enough(time_step, ego_vehicle) -> ((in_leftmost_lane(time_step, ego_vehicle)
                      -> drives_leftmost(time_step, ego_vehicle, other_vehicles))
                      && (!(in_leftmost_lane(time_step, ego_vehicle))
                      -> drives_rightmost(time_step, ego_vehicle, other_vehicles))))
                  && (!(interstate_broad_enough(time_step, ego_vehicle))
                      -> drives_right_lane_rightmost(time_step, ego_vehicle))))
   # R_I5: always((once(on_access_ramp(time_step, other_vehicle)) && on_main_carriage_way(time_step, other_vehicle)) -> (!(once(!(in_rightmost_lane(time_step, ego_vehicle))) && in_rightmost_lane(time_step, ego_vehicle))))
   # R_I5: (!(once(!(in_rightmost_lane(time_step, ego_vehicle))) && in_rightmost_lane(time_step, ego_vehicle)))




# Parameters for traffic rules
###
# .. code-block:: yaml
#
#   - a_abrupt: acceleration difference which indicates abrupt braking
#   - min_velocity_dif: minimum velocity difference
#   - standstill_error: velocity deviation from zero which is still classified to be standstill
#   - num_veh_congestion: minimum number of slow-moving leading vehicles so that a vehicle can be assumed to be part of a congestion
#   - max_congestion_velocity: maximum velocity of a vehicle withing a congestion
#   - max_velocity_limit_free_driving:
#   - desired_interstate_velocity: desired velocity on interstates
#   - min_interstate_width: minimum interstate width so that emergency lane can be created
#   - close_to_lane_border:  indicator if vehicle is close to lane border
#   - slightly_higher_speed_difference:  indicator for slightly higher speed
#   - u_turn: angle [rad] indicating u-turn
#   - country: countries where traffic rules are applied
traffic_rules_param:
    j_abrupt: -2 # for ego vehicle emergency profile calculation
    a_abrupt: -2
    min_velocity_dif: 15
    standstill_error: 0.01
    num_veh_congestion: 2
    max_congestion_velocity: 2.77
    max_velocity_limit_free_driving: 27.77
    desired_interstate_velocity: 36.11
    min_interstate_width: 6.75
    close_to_lane_border: 0.4
    close_to_other_vehicle: 1.0
    slightly_higher_speed_difference: 5.55
    u_turn: 1.57
    country: "DEU"


traffic_rule_sets:
    F_S0: [R_G1, R_G2, R_G3, R_G4, R_G5, R_I1, R_I2, R_I3, R_I4, R_I5, R_I6, R_I7]
    F_SRG1: [R_G1]
    F_SRG2: [R_G2]
    F_SRG3: [R_G3]
    F_SRG4: [R_G4]
    F_SRG5: [R_G5]
    F_SRI1: [R_I1]
    F_SRI2: [R_I2]
    F_SRI3: [R_I3]
    F_SRI4: [R_I4]
    F_SRI5: [R_I5]
    F_SRI6: [R_I6]
    F_SRI7: [R_I7]
    B_S0: [R_G1, R_G2, R_G3, R_G4, R_G5, R_I1, R_I2, R_I3, R_I4, R_I7]
    B_S1: [R_G1, R_G2, R_G3, R_G5, R_I1, R_I2, R_I3, R_I4]
    B_SRG1: [R_G1]
    B_SRG2: [R_G2]
    B_SRG3: [R_G3]
    B_SRG4: [R_G4]
    B_SRG5: [R_G5]
    B_SRI1: [R_I1]
    B_SRI2: [R_I2]
    B_SRI3: [R_I3]
    B_SRI4: [R_I4]
    B_SRI5: [R_I5]
    B_SRI6: [R_I6]
    B_SRI7: [R_I7]
activated_traffic_rule_sets: [B_S1]
vehicle_dependent_rules: [R_G1, R_G2, R_I2, R_I5, R_I6, R_I7]
