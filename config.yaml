
# simulation parameters
###
# .. code-block:: yaml
#
#    - dt: time step size
#    - commonroad_benchmark_id: CommonRoad solution file name
#    - commonroad_scenario_folder: folder in which CommonRoad scenarios are located
#    - verbose_mode: activate/deactivate status output of algorithms and simulation
#    - time_measuring: activate/deactivate computation time measuring
#    - c_profile: activate/deactivate storing of computation time by using cProfile package
#    - commonroad_video_creation: activate/deactivate video creation of CommonRoad scenario
#    - profile_video_creation: activate/deactivate video creation of profiles
#    - plotting: activate/deactivate plotting of state profiles
#    - other_vehicle_plots: list with CommonRoad obstacle IDs which should be considered for plotting
#    - store_profiles: activate/deactivate storage of profiles
#    - video_output_folder: folder in which the created videos are stored
#    - country: country of scenario
simulation_param:
    dt: 0.1
    commonroad_benchmark_id: USA_US101-33_1_T-1
    commonroad_scenario_folder: ./scenarios/test/
    verbose_mode: true
    time_measuring: true
    c_profile: false
    commonroad_video_creation: false
    profile_video_creation: false
    plotting: false
    other_vehicle_plots: [140]
    store_profiles: false
    video_output_folder: ./videos
    country: "DEU"

# road network and curvilinear coordinate system parameters
###
# .. code-block:: yaml
#
#    - num_chankins_corner_cutting: number of how often chankins algorithm should be applied
#    - polyline_resampling_step: step size for polyline resampling
#    - merging_length: maximum accumulated length of lanalets belonging to a lane
road_network_param:
    num_chankins_corner_cutting: 200
    polyline_resampling_step: 0.5
    merging_length: 10000

# Ego vehicle parameters
###
# .. code-block:: yaml
#
#    - vehicle_number: CommonRoad vehicle number; possible options are 1, 2 or 3 (see CommonRoad vehicle models)
#    - a_max: maximum acceleration of ACC vehicle
#    - a_min: minimum acceleration of ACC vehicle
#    - j_max: maximum jerk of ACC vehicle
#    - j_min: minimum jerk of ACC vehicle
#    - v_des: desired velocity of ACC vehicle
#    - t_react: reaction time of ACC vehicle
#    - dynamics_param: physical parameters of ACC vehicle; will be initialized during runtime
#    - fov: field of view (sensor range)
#    - v_min: minimum allowed velocity considering vehicle dynamics
#    - const_dist_offset: minimum distance at standstill
#    - emergency_profile: emergency jerk profile
#    - emergency_profile_num_steps_fb: number of steps minimum jerk should be attended to emergency profile
#    - fov_speed_limit: speed limit based on field of view
#    - braking_speed_limit: speed limit to ensure comfortable braking within field of view

ego_vehicle_param:
    vehicle_number: 2
    a_max: 3
    a_min: -10.0
    a_corr: 0.0
    j_max: 10
    j_min: -10
    v_des: 30
    t_react: 0.3
    dynamics_param: None
    fov: 200
    v_min: 0
    const_dist_offset: 0
    emergency_profile: []
    emergency_profile_num_steps_fb: 200
    fov_speed_limit: None
    braking_speed_limit: None
    road_condition_speed_limit: 50

# Other vehicle's parameters
###
# .. code-block:: yaml
#
#    - vehicle_number: CommonRoad vehicle number; possible options are 1, 2 or 3 (see CommonRoad vehicle models)
#    - v_max: maximum velocity of leading vehicle
#    - v_min: minimum velocity of leading vehicle
#    - a_max: maximum acceleration of leading vehicle
#    - a_min: minimum acceleration of leading vehicle
#    - j_max: maximum jerk of leading vehicle
#    - j_min: minimum jerk of leading vehicle

other_vehicles_param:
    vehicle_number: 2
    v_max: 60
    v_min: 0
    a_max: 5
    a_min: -10.5
    j_max: 10
    j_min: -10
    dynamics_param: None  # TODO replace dynamics parameter with worst case behavior

# Visualization parameters
###
#    - Parameters for plotting of profiles
#    - Parameters for video creation
visualization:
    # Parameters for plotting of profiles
    ###
    # .. code-block:: yaml
    #
    #   - width: width of matplotlib figure
    #   - line_width: line width of profiles
    #   - font_size: font size of text within the plot
    #   - axes_line_width: line width of the axes
    #   - type of figure which should be stored
    plot:
        width: 3.75
        line_width: 0.75
        font_size: 9
        axes_line_width: 0.25
        figure_type: eps

    # Parameters for video creation
    ###
    # .. code-block:: yaml
    #
    #   - obstacle_label: activate/deactivate visualization of obstacle label (ID) in video
    video:
        obstacle_label : false

# Traffic rule information
###
#    - traffic rules formalized in temporal logic
#    - traffic rule parameters
#    - supported traffic rule sets
#    - activated traffic rule set
#    - list of traffic rules which must be evaluated with respect to several other vehicles
traffic_rule_monitoring:
    # Traffic rules formalized in metric temporal logic (MTL)
    ###
    # .. code-block:: yaml
    #
    #   - max_speed_limit: rule which evaluates maximum speed limit
    #   - min_speed_limit: rule which evaluates minimum speed limit
    #   - safe_distance: rule which evaluates safe distance
    #   - no_unnecessary_braking: rule which evaluates unnecessary strong braking
    traffic_rules:
        max_speed_limit: G(keeps_lane_speed_limit & keeps_fov_speed_limit & keeps_braking_speed_limit & keeps_road_condition_speed_limit)
        min_speed_limit: G(preserves_traffic_flow & keeps_sign_min_speed_limit)
        safe_distance: G((in_front_of_ego_vehicle & same_lane_as_ego_vehicle) -> keeps_safe_distance)
        no_unnecessary_braking: G(~(unnecessary_braking))

    # Parameters for traffic rules
    ###
    # .. code-block:: yaml
    #
    #   - j_min_abrupt:
    #   - delta_a_abrupt:
    #   - min_velocity_dif:
    #   - standstill_error:
    #   - num_veh_congestion:
    #   - max_congestion_velocity:
    #   - max_velocity_limit_free_driving:
    #   - desired_highway_velocity:
    traffic_rules_param:
        j_abrupt: -2
        a_abrupt: -2
        min_velocity_dif: 10
        standstill_error: 0.01
        num_veh_congestion: 4
        max_congestion_velocity: 10
        max_velocity_limit_free_driving: 27.77
        desired_highway_velocity: 36.11

    traffic_rule_sets:
        0: [max_speed_limit, max_speed_limit, min_speed_limit, safe_distance, no_unnecessary_braking]
        1: [safe_distance]
        2: [no_unnecessary_braking]
        3: [max_speed_limit]
        4: [min_speed_limit]


    activated_traffic_rule_sets: [0]
    vehicle_dependent_rules: [safe_distance]
