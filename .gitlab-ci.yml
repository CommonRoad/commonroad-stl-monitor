image: continuumio/anaconda3

stages:
- test

before_script:
- apt-get update -y > /dev/null
- DEBIAN_FRONTEND=noninteractive
- apt-get install -y apt-utils > /dev/null
- apt-get install -y build-essential > /dev/null
- apt-get install -y cmake > /dev/null
- apt-get install libboost-all-dev > /dev/null
- apt-get install libomp-dev
- echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
- conda create -n commonroad python=3.6
- curl -O https://bootstrap.pypa.io/get-pip.py
- pip install tox coverage

python36:
  stage: test
  script:
    - source activate commonroad
    # This is required for the GitLab runner to have permissions to all the repos the user stating the job has.
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de/".insteadOf "git@gitlab.lrz.de:"
    # Install commonroad-io manually as installing though does not respect the JOB_TOKEN
    - git clone --branch develop git@gitlab.lrz.de:cps/commonroad-io.git $HOME/commonroad-io
    - pip install -e $HOME/commonroad-io
    - git clone --branch development git@gitlab.lrz.de:cps/commonroad-curvilinear-coordinate-system.git $HOME/commonroad-curvilinear-coordinate-system
    - cd $HOME/commonroad-curvilinear-coordinate-system/pybind
    - mkdir build
    - cd build
    - cmake ..
    - make check
    - cd $HOME/commonroad-curvilinear-coordinate-system/
    - mkdir -p build
    - cd build
    - cmake -DADD_PYTHON_BINDINGS=TRUE -DPATH_TO_PYTHON_ENVIRONMENT="${CONDA_PREFIX}/bin/envs/commonroad/" -DPYTHON_VERSION="3.6" -DCMAKE_BUILD_TYPE=Release ..
    - make
    - cd ..
    - pip install -e
    - pip install -r ./requirements.txt
    - pip install -e .[tests]
    - coverage run tests/run_tests.py
