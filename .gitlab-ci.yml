image: python:3.8

cache:
  paths:
    - .venv

stages:
  - style
  - test
  - deploy

before_script:
  - pip install poetry
  - poetry config virtualenvs.in-project true
  - poetry install
  - source .venv/bin/activate

unittest:
  stage: test
  script:
    - python -m unittest

flake8:
  stage: style
  needs: [ ]
  image: python:3.8-buster
  before_script: [ ]
  cache: [ ]
  allow_failure: true
  script:
    - pip install flake8 flake8-todo
    - flake8 crmonitor

black:
  stage: style
  needs: [ ]
  image: pyfound/black:22.6.0
  before_script: [ ]
  cache: [ ]
  allow_failure: true
  script:
    - black --check --verbose --diff --color crmonitor

deploy_master:
  stage: deploy
  script:
    - poetry config repositories.gitlab ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
    - poetry build
    - poetry publish --repository gitlab -u gitlab-ci-token -p ${CI_JOB_TOKEN}
  only:
    - master
  except:
    - tags
