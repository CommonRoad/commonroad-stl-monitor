image: python:3.10

variables:
  # Change pip's cache directory to be inside the project directory since we can only cache local items.
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GIT_SUBMODULE_STRATEGY: normal

cache:
  paths:
    # Cache the poetry installation for all jobs.
    # We could also cache all project dependencies, but the up-/download of the cache takes longer than installing only the relevant dependencies in each job.
    - .cache/pip

stages:
  - style
  # test-unit runs simple unit tests which are quickly executed.
  - test-unit
  # test-integration runs more complex integration tests, e.g. rule evaluation which is quite resources intensive.
  - test-integration
  - deploy

before_script: &default_before_script
  - pip install poetry
  - poetry config virtualenvs.in-project true
  - poetry config system-git-client true
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de".insteadOf "ssh://git@gitlab.lrz.de"


pre_commit:
  stage: style
  before_script:
    - *default_before_script
    - poetry install --extras dev
  script:
    - poetry run pre-commit run --all-files --show-diff-on-failure

test_python_unit:
  stage: test-unit
  before_script:
    - *default_before_script
    - poetry install --extras test
  script:
    - poetry run coverage run --source=./crmonitor -m pytest tests/unit
    - poetry run coverage report -m || true
    - poetry run coverage xml
  coverage: /(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test_python_integration:
  stage: test-integration
  before_script:
    - *default_before_script
    - poetry install --extras test
  script:
    - poetry run coverage run --source=./crmonitor -m pytest tests/integration
    - poetry run coverage report -m || true
    - poetry run coverage xml
  coverage: /(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

deploy_master:
  stage: deploy
  script:
    - poetry config repositories.gitlab ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
    - poetry build
    - poetry publish --repository gitlab -u gitlab-ci-token -p ${CI_JOB_TOKEN}
  only:
    - master
  except:
    - tags

pages:
  # push the latest documentation of the develop branch to the Gitlab pages.
  # available at https://cps.pages.gitlab.lrz.de/commonroad/commonroad-stl-monitor
  stage: deploy
  only:
    - master
  publish: site
  before_script:
    - *default_before_script
    - poetry install --extras docs
  script:
    - poetry run mkdocs build
  artifacts:
    paths:
      - site
  environment:
    name: Gitlab Pages
    url: https://cps.pages.gitlab.lrz.de/commonroad/commonroad-stl-monitor
