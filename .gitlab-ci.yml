image: continuumio/anaconda3
# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - .cache/pip
#    - anaconda3/envs

stages:
  - test
  - deploy

# before_script:
#  - apt-get update && apt-get install -y cmake g++
#  - conda init bash
#  - conda env create -f environment.yml
#  - source activate stl-crmonitor
#  - conda info
#  - conda develop $CI_PROJECT_DIR

unittest:
  stage: test
  script:
    - cd $CI_PROJECT_DIR/crmonitor/tests && python -m unittest
  # temporary for testing
  when: manual
  allow_failure: true

deploy_develop:
  stage: deploy
  script:
    - git lfs install
    - pip install twine bump2version
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_NAME}"
    - bump2version build
    - python setup.py sdist bdist_wheel
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
    - git remote set-url origin "https://gitlab-ci-token:${VERSION_BUMP_PUSH_TOKEN}@gitlab.lrz.de/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}.git"
    - git push -o ci.skip origin HEAD:${CI_COMMIT_REF_NAME}
  when: manual
